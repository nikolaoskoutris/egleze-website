<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  #feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}

  .htrack{height:100%;display:flex;overflow-x:scroll;scroll-snap-type:x mandatory;overscroll-behavior-x:contain}
  .htrack::-webkit-scrollbar{display:none}
  .pane{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden}
  /* ── VIDEO pane (home): clean clip in a band, text BELOW (no overlay) ── */
  .vpane{background:#0c0b09}
  .vzone{position:absolute;top:0;left:0;right:0;height:56%;background:#000;display:flex;align-items:center;justify-content:center}
  .v-vid{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .v-poster{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .2s}
  .slide.audio-only .v-poster{opacity:1}
  .v-poster.fallback{background:linear-gradient(180deg,#241f18,#0c0b09);opacity:1}
  .v-tap{position:absolute;inset:0;z-index:2}
  .play-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:3;opacity:0;transition:opacity .2s;pointer-events:none}

  .dur{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:14px;z-index:4;font-family:"Roboto Condensed",sans-serif;font-size:11px;color:#e7ddcd;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:20px}
  .sound{position:absolute;top:calc(env(safe-area-inset-top) + 54px);right:14px;z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.42);border:none;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}

  .veditorial{position:absolute;top:56%;left:0;right:0;bottom:92px;padding:16px 18px 0;overflow:hidden}

  .v-cat .bar{display:inline-block;width:14px;height:2px;background:#bb1919;vertical-align:3px;margin-right:7px}
  .v-show{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .v-art{width:30px;height:30px;border-radius:6px;background:#2a241c;background-size:cover;background-position:center;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:"Roboto Condensed",sans-serif;font-size:12px;color:#cfc6b6}

  .sum-label{font-family:"Roboto Condensed",sans-serif;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#8c8579;margin:20px 0 7px}
  .sum-body{font-family:"DM Sans";font-size:14px;line-height:1.62;color:#cfc8ba}
  .sum-kp{list-style:none;margin-top:6px}
  .sum-kp li{font-family:"DM Sans";font-size:13.5px;line-height:1.5;color:#cfc8ba;padding:7px 0 7px 18px;position:relative;border-top:.5px solid rgba(255,255,255,.06)}
  .sum-kp li:before{content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;border-radius:50%;background:#bb6a19}
  .sum-cta{display:inline-block;margin:12px 0 6px;font-family:"Roboto Condensed",sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:#bb1919;border:.5px solid #bb1919;padding:9px 16px;border-radius:30px;text-decoration:none}
  /* ── REACTIONS pane ───────────────────────────────────────────────── */
  .react{background:#100f0d;height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 62px) 18px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column}
  .react::-webkit-scrollbar{display:none}
  .react-h{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:22px;color:#fff;margin-bottom:3px}
  .react-sub{font-family:"DM Sans";font-size:11.5px;line-height:1.45;color:#8c8579;margin-bottom:16px}
  .rrow{padding:12px 0;border-top:.5px solid rgba(255,255,255,.08)}
  .rrow .lab{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .rrow .d{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .rrow .nm{font-family:"DM Sans";font-size:14px;font-weight:500;color:#ece6dc}
  .rrow .lv{margin-left:auto;font-family:"Roboto Condensed",sans-serif;font-size:10px;letter-spacing:.5px;color:#8c8579;text-align:right}
  .rrow .cnt{font-family:"Roboto Condensed",sans-serif;font-size:10px;letter-spacing:.5px;color:#6f6a60;margin-top:6px}
  .segs{display:flex;gap:6px}
  .seg{flex:1;height:40px;border:.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#d8d2c6;border-radius:9px;font-family:"Roboto Condensed",sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:transform .08s}
  .seg:active{transform:scale(.94)}
  .react-foot{font-family:"DM Sans";font-size:10.5px;line-height:1.45;color:#6f6a60;margin-top:18px;padding-top:14px;border-top:.5px solid rgba(255,255,255,.08)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#8c8579;font-family:"Roboto Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:12px;z-index:50;background:#0c0b09}
  #boot.gone{display:none}
  .spin{width:26px;height:26px;border:2px solid rgba(255,255,255,.15);border-top-color:#bb1919;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

    function firstSentence(t,max){if(!t)return '';t=String(t).trim();var m=t.match(/^.*?[.!?](\s|$)/);var out=m?m[0].trim():t;if(out.length>max)out=out.slice(0,max).replace(/\s+\S*$/,'')+'…';return out;}
    function durStr(s){var len=(s.clip_end_seconds&&s.clip_start_seconds)?(s.clip_end_seconds-s.clip_start_seconds):60;var mm=Math.floor(len/60),ss=len%60;return mm>0?(mm+':'+String(ss).padStart(2,'0')):('0:'+String(ss).padStart(2,'0'));}

    async function sb(path){

      return res.json();
    }

    var shows={}, allStories=[], renderMap={}, io=null, currentFilter='all', feedToken=0;

    // ── reactions pane (full screen, wired to window.egleze.reactions) ──

      var rows=REACTIONS.map(function(r){
        var segs='';

        +'<div class="react-sub">Tap a strength 1\u20135. Tap it again to clear. Private \u2014 everyone sees totals, no one sees it was you.</div>'

    }
    function wireReactionPane(paneEl,s){
      var id=String(s.id);
      function paint(){
        var mine=window.egleze.reactions.getMine(id)||{};
        var totals=window.egleze.reactions.getTotals(id)||[];
        var tBy={}; totals.forEach(function(t){tBy[t.reaction]=t;});
        REACTIONS.forEach(function(r){
          var lvl=mine[r.k]||0;
          var lvEl=paneEl.querySelector('[data-lv="'+r.k+'"]');
          var cntEl=paneEl.querySelector('[data-cnt="'+r.k+'"]');
          if(lvEl) lvEl.textContent=lvl>0?(lvl+' \u00b7 '+LV[lvl]):'';
          if(cntEl){var t=tBy[r.k];cntEl.textContent=(t&&t.display)?t.display:'\u00b7';}
          paneEl.querySelectorAll('.seg[data-k="'+r.k+'"]').forEach(function(b){
            var on=parseInt(b.getAttribute('data-l'),10)===lvl;
            b.style.background=on?r.c:'rgba(255,255,255,.07)';
            b.style.borderColor=on?r.c:'rgba(255,255,255,.2)';
            b.style.color=on?'#fff':'#d8d2c6';
          });
        });
      }
      renderMap[id]=paint;
      paneEl.querySelectorAll('.seg').forEach(function(b){
        b.addEventListener('click',function(e){
          e.stopPropagation();
          var k=b.getAttribute('data-k'), lvl=parseInt(b.getAttribute('data-l'),10);
          var cur=(window.egleze.reactions.getMine(id)||{})[k]||0;
          window.egleze.reactions.setForStory(id,k,cur===lvl?0:lvl);
        });
      });
      paint();
    }

    function buildSlide(s){

      var art=show.artwork_url||'';

      var summary=esc(s.summary||'');
      var epSummary=(typeof s.episode_summary==='string'&&s.episode_summary.trim())?esc(s.episode_summary.trim()):'';

      var kpHtml=kps.length?('<div class="sum-label">Key moments</div><ul class="sum-kp">'+kps.map(function(k){return '<li>'+esc(k)+'</li>';}).join('')+'</ul>'):'';

      // VIDEO pane — clean clip (contain) on top, editorial BELOW, no overlay

        +'</div>'
        +'<div class="vfoot"><div class="v-actions">'
          +'<button class="act-btn eg-bookmark" data-story-id="'+s.id+'" aria-label="Save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 H18 V20 L12 16 L6 20 Z"/></svg></button>'

        +'</div></div>'
      +'</div>';

      var summaryPane='<div class="pane"><div class="sum">'
        +'<div class="sum-kick">'+esc(s.show_name||'Egleze')+(s.episode?(' \u00b7 '+esc(s.episode)):'')+'</div>'
        +'<div class="sum-head">'+esc(s.headline||'')+'</div>'
        +(s.quote?'<div class="sum-q"><div class="bar"></div><div class="txt">\u201c'+esc(s.quote)+'\u201d</div></div>':'')
        +'<a class="sum-cta" href="https://egleze.com/story/'+s.id+'" target="_blank" rel="noopener">Read the full story on Egleze \u2192</a>'
        +(summary?'<div class="sum-label">The story</div><div class="sum-body">'+summary+'</div>':'')
        +(epSummary?'<div class="sum-label">From this episode</div><div class="sum-body">'+epSummary+'</div>':'')
        +kpHtml
      +'</div></div>';

      var slide=document.createElement('div');
      slide.className='slide paused';
      slide.setAttribute('data-story-id',s.id);
      slide.innerHTML='<div class="htrack"><div class="pane">'+reactionPaneHTML(s)+'</div>'+video+summaryPane+'</div>';

      wireReactionPane(slide.querySelector('[data-reactions-pane-for]'),s);

      var vid=slide.querySelector('.v-vid');
      var tap=slide.querySelector('[data-tap]');
      if(tap) tap.addEventListener('click',function(){
        if(!soundUnlocked){ soundUnlocked=true; applySoundToActive(); return; } // first tap = turn sound on
        if(!vid)return;
        if(vid.paused){ var p=vid.play(); if(p&&p.catch)p.catch(function(){}); slide.classList.remove('paused'); }
        else{ vid.pause(); slide.classList.add('paused'); }
      });
      var sndBtn=slide.querySelector('[data-sound]');
      if(sndBtn) sndBtn.addEventListener('click',function(e){ e.stopPropagation(); cycleSound(); });
      return slide;
    }

    function activeSlide(){
      var feed=document.getElementById('feed');
      var slides=feed.querySelectorAll('.slide');
      var best=null,bd=1e9;
      slides.forEach(function(sl){var r=sl.getBoundingClientRect();var d=Math.abs(r.top);if(d<bd){bd=d;best=sl;}});
      return best;
    }
    function applySoundToActive(){
      var sl=activeSlide(); if(!sl)return;
      var vid=sl.querySelector('.v-vid'); if(!vid)return;
      var muteIt=(!soundUnlocked)||(soundMode===2);
      vid.muted=muteIt;
      sl.classList.toggle('audio-only', soundMode===1 && soundUnlocked);
      if(!vid.paused){} else { var p=vid.play(); if(p&&p.catch)p.catch(function(){}); }
    }
    function cycleSound(){
      soundUnlocked=true;
      soundMode=(soundMode+1)%3;
      document.querySelectorAll('[data-sound]').forEach(function(b){ b.innerHTML=ICONS[soundMode]; b.setAttribute('aria-label', soundMode===0?'Video and sound':(soundMode===1?'Audio only':'Muted')); });
      applySoundToActive();
    }

    function centerTrack(slide){ var tr=slide.querySelector('.htrack'); if(tr) tr.scrollLeft=tr.clientWidth; }
    function activate(slide){
      centerTrack(slide);
      var id=slide.getAttribute('data-story-id');
      var vid=slide.querySelector('.v-vid');
      if(vid){ if(!vid.src&&vid.getAttribute('data-src')) vid.src=vid.getAttribute('data-src'); vid.muted=(!soundUnlocked)||(soundMode===2); var p=vid.play(); if(p&&p.catch)p.catch(function(){}); slide.classList.remove('paused'); slide.classList.toggle('audio-only', soundMode===1 && soundUnlocked); }
      if(window.egleze&&window.egleze.reactions){
        window.egleze.reactions.refreshTotals(id);
        if(window.egleze.reactions._loadMine) window.egleze.reactions._loadMine(id);
      }
    }
    function deactivate(slide){ var vid=slide.querySelector('.v-vid'); if(vid){ try{vid.pause();}catch(_){} } slide.classList.add('paused'); }

    function fetchPage(filter, offset){
      var q='stories?select=*&'+CLIP_FILTER+(filter==='all'?'':('&topic=eq.'+encodeURIComponent(filter)))
        +'&order=updated_at.desc.nullslast&limit='+PAGE+'&offset='+offset;
      return sb(q);
    }
    function appendSlides(list, feed){
      var slides=list.map(buildSlide);
      var frag=document.createDocumentFragment();
      slides.forEach(function(sl){ frag.appendChild(sl); });
      feed.appendChild(frag);
      if(io) slides.forEach(function(sl){ io.observe(sl); });
    }
    async function renderFeed(filter){
      currentFilter=filter;
      var my=++feedToken;
      feedOffset=0; feedExhausted=false; feedLoading=true;
      var feed=document.getElementById('feed');
      if(io){ io.disconnect(); io=null; }
      renderMap={};
      feed.innerHTML='<div style="height:100dvh;display:flex;align-items:center;justify-content:center"><div class="spin"></div></div>';
      var list;
      try{ list=await fetchPage(filter,0); }
      catch(e){ console.error('[app-shorts] feed fetch failed',e); if(my===feedToken) feed.innerHTML='<div style="height:100dvh;display:flex;align-items:center;justify-content:center;color:#8c8579;font-family:Roboto Condensed,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase">Could not load</div>'; feedLoading=false; return; }
      if(my!==feedToken) return; // a newer category tap superseded this fetch
      feed.innerHTML='';
      if(!list.length){ feed.innerHTML='<div style="height:100dvh;display:flex;align-items:center;justify-content:center;color:#8c8579;font-family:Roboto Condensed,sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:12px">No stories in this category</div>'; feedLoading=false; return; }
      io=new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting&&e.intersectionRatio>0.6) activate(e.target); else deactivate(e.target); });
      },{root:feed,threshold:[0,0.6,1]});
      appendSlides(list, feed);
      feedOffset=list.length;
      if(list.length<PAGE) feedExhausted=true;
      feed.scrollTo({top:0});
      var first=feed.querySelector('.slide');
      if(first){ centerTrack(first); setTimeout(function(){ centerTrack(first); activate(first); },50); }
      feedLoading=false;
    }
    async function loadMore(){
      if(feedLoading||feedExhausted) return;
      feedLoading=true;
      var my=feedToken;
      var list;
      try{ list=await fetchPage(currentFilter,feedOffset); }
      catch(e){ console.error('[app-shorts] loadMore failed',e); feedLoading=false; return; }
      if(my!==feedToken){ feedLoading=false; return; } // category changed mid-fetch
      appendSlides(list, document.getElementById('feed'));
      feedOffset+=list.length;
      if(list.length<PAGE) feedExhausted=true;
      feedLoading=false;
    }

    async function buildCats(){
      var bar=document.getElementById('cats');
      var rows;
      try{ rows=await sb('stories?select=topic&'+CLIP_FILTER); }catch(e){ rows=[]; }
      var counts={};
      rows.forEach(function(r){ var t=r.topic; if(t) counts[t]=(counts[t]||0)+1; });
      var topics=Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }); // busiest topics first
      var html='<button class="chip on" data-cat="all">All</button>';
      topics.forEach(function(t){ html+='<button class="chip" data-cat="'+esc(t)+'">'+esc(t)+'</button>'; });
      bar.innerHTML=html;
      bar.addEventListener('click',function(e){
        var c=e.target.closest&&e.target.closest('.chip'); if(!c)return;
        bar.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
        c.classList.add('on');
        renderFeed(c.getAttribute('data-cat'));
      });
    }

    function boot(m){var b=document.getElementById('boot-msg');if(b)b.textContent=m;}
    function bootDone(){var b=document.getElementById('boot');if(b)b.classList.add('gone');}

    async function start(){
      try{
        boot('Loading');
        (await sb('shows?select=name,artwork_url,website_url&active=eq.true')).forEach(function(x){shows[x.name]=x;});
        await Promise.all([ buildCats(), renderFeed('all') ]);
        bootDone();
        // infinite scroll: fetch the next page as the user nears the end
        var feed=document.getElementById('feed');
        feed.addEventListener('scroll',function(){
          if(feed.scrollHeight - feed.scrollTop - feed.clientHeight < feed.clientHeight*1.5) loadMore();
        },{passive:true});
        if(window.egleze&&window.egleze.reactions&&window.egleze.reactions.onChange){
          window.egleze.reactions.onChange(function(changedId){ var fn=renderMap[String(changedId)]; if(fn)fn(); });
        }
      }catch(err){ console.error('[app-shorts] start failed',err); boot('Could not load — check connection'); }
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  })();
  </script>
</body>
