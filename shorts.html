<style>
:root{--red:#bb1919;--red-deep:#8a1414;--gold:#d6c79e;--cream:#f5ede0;--ink:#1a1a1a;--bg:#0a0a0a;--panel:#161310}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;height:100dvh;background:var(--bg);color:#fff;
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  overflow:hidden;position:fixed;inset:0;width:100%;
}

/* ─── FEED: vertical scroll-snap container ───────────────────────── */
.feed{
  position:absolute;inset:0;z-index:1;
  overflow-y:scroll;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.feed::-webkit-scrollbar{display:none}

/* Each story is a full-screen snap slide */
.story{
  position:relative;width:100%;height:100dvh;
  scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden;
}
/* a shell is an un-hydrated slide — full height for scroll-snap, but empty.
   A subtle pulsing E keeps it from looking broken if the user lands on one
   mid-hydration. */
.story.shell{display:block}
.story.shell::after{
  content:"E";position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
  width:48px;height:48px;border-radius:50%;background:var(--red);color:#fff;
  font-family:'Playfair Display',serif;font-weight:900;font-size:28px;
  display:flex;align-items:center;justify-content:center;opacity:.5;
  animation:pulse 1.4s infinite;
}

/* ─── TOP CHROME: back + menu ────────────────────────────────────── */
.top-chrome{
  position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:max(env(safe-area-inset-top),12px) 12px 8px;
  pointer-events:none;
}
.top-chrome > *{pointer-events:auto}
.chrome-btn{
  width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;color:#fff;
  border:none;cursor:pointer;backdrop-filter:blur(10px);font-size:18px;
  transition:transform .15s ease;
}
.chrome-btn:active{transform:scale(0.9)}

/* ─── VIDEO ZONE (top, clean, no overlay) ────────────────────────── */
.video-zone{
  position:relative;width:100%;
  height:58%;flex-shrink:0;
  background:#000;
  display:flex;align-items:center;justify-content:center;
}
.story-video{
  width:100%;height:100%;object-fit:contain;background:#000;display:block;
}
.story-video::-webkit-media-controls{display:none!important}
.story-video::-webkit-media-controls-enclosure{display:none!important}
/* Show artwork poster while video loads / for audio-only fallback */
.video-poster{
  position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:1;transition:opacity .3s ease;pointer-events:none;
}
.story.video-ready .video-poster{opacity:0}
.video-poster.fallback{
  background:linear-gradient(135deg,#241a10,#0f0d0a);
  display:flex;align-items:center;justify-content:center;
}
/* clip duration badge */
.clip-dur{
  position:absolute;bottom:10px;left:12px;z-index:4;
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(0,0,0,0.6);color:#fff;
  font-family:'Roboto Condensed',sans-serif;font-size:11px;letter-spacing:.5px;
  padding:4px 9px;border-radius:3px;backdrop-filter:blur(10px);
}
/* center pause/play hint */
.play-hint{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:5;width:64px;height:64px;border-radius:50%;
  background:rgba(0,0,0,0.45);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#fff;opacity:0;transition:opacity .2s ease;
  pointer-events:none;
}
.story.paused .play-hint{opacity:1}
/* video progress bar at bottom of video zone */
.v-progress{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:rgba(255,255,255,0.18);z-index:4;
}
.v-progress-fill{height:100%;background:var(--red);width:0%;transition:width .15s linear}

/* tap zone covers just the video so taps = pause/play */
.tap-zone{
  position:absolute;inset:0;z-index:3;cursor:pointer;background:transparent;
}

.panel-headline{

.panel-quote{

}
.panel-quote .bar{width:3px;align-self:stretch;background:var(--red);flex-shrink:0}
.panel-quote .txt{

// Shows any JS error as on-screen text instead of a silent crash,
// so we can read the actual error on the phone. Remove once fixed.
(function(){
  function showErr(msg){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#bb1919;color:#fff;font:12px/1.4 monospace;padding:10px;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto;';
    d.textContent = 'ERROR: ' + msg;
    document.body && document.body.appendChild(d);
  }

    showErr((e.message||'unknown') + '\n@ ' + (e.filename||'') + ':' + (e.lineno||'') + ':' + (e.colno||''));
  });
  window.addEventListener('unhandledrejection', function(e){
    showErr('Promise: ' + ((e.reason && (e.reason.message||e.reason)) || 'unknown'));
  });
})();
</script>

const CATEGORIES = [

// ─── helpers ───────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function truncate(s,n){ return s && s.length>n ? s.slice(0,n)+'…' : (s||''); }
function initials(name){ return (String(name||'E').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('')||'E').toUpperCase(); }

function slugifyHeadline(text){
  if(!text) return '';
  return String(text).toLowerCase()
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-')
    .replace(/^-|-$/g,'').substring(0,80);
}
function buildStoryUrl(id, headline){
  const base = slugifyHeadline(headline);
  return '/story/' + id + (base ? '-'+base : '');
}

// pull first sentence of the quote for the compact quote line
function firstSentence(q, max){
  if(!q) return '';
  const s = String(q).trim();
  const m = s.match(/^[^.!?]*[.!?]/);
  let out = m ? m[0] : s;
  if(out.length > max) out = out.slice(0, max).replace(/\s+\S*$/,'') + '…';
  return out;
}

// strict round-robin so consecutive shorts aren't from the same show
function interleaveByShow(stories){
  if(!Array.isArray(stories) || stories.length < 3) return stories || [];
  const groups = new Map();
  stories.forEach(s=>{ const k=(s&&s.show_name)||'__u__'; if(!groups.has(k))groups.set(k,[]); groups.get(k).push(s); });
  if(groups.size === 1) return stories.slice();
  const result=[]; let last=null;
  while(result.length < stories.length){
    let bestK=null,bestC=-1;
    groups.forEach((arr,k)=>{
      if(arr.length===0) return;
      if(k===last && groups.size>1){
        let others=false; groups.forEach((a,kk)=>{ if(kk!==last&&a.length>0)others=true; });
        if(others) return;
      }
      if(arr.length>bestC){bestC=arr.length;bestK=k;}
    });
    if(bestK===null) break;
    result.push(groups.get(bestK).shift()); last=bestK;
  }
  return result;
}

// ─── data ──────────────────────────────────────────────────────────
async function fetchSupabase(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'Accept-Profile':'public' }
  });
  if(!res.ok) throw new Error('Supabase '+res.status);
  return res.json();
}
async function loadShows(){
  try{
    const shows = await fetchSupabase('shows?select=name,artwork_url,website_url&active=eq.true');
    shows.forEach(s=> state.shows[s.name]=s);
  }catch(e){ console.warn('[shorts] shows failed', e); }
}
async function loadStories(){
  try{
    // Only stories with a rendered clip. We use the clean clips/ file for
    // playback, but clip_vertical_url being set is our proof the render
    // pipeline finished for this story (so the clip exists).
    const path = 'stories?select=*&status=eq.approved&clip_vertical_url=not.is.null&clip_start_seconds=not.is.null&clip_end_seconds=not.is.null&order=updated_at.desc.nullslast&limit=300';
    state.allStories = await fetchSupabase(path);
  }catch(e){ console.error('[shorts] stories failed', e); state.allStories=[]; }
}

// ─── categories (sheet) ────────────────────────────────────────────
function renderCategories(){
  const list = document.getElementById('sheet-list');
  const counts = {};
  state.allStories.forEach(s=>{ if(s.topic) counts[s.topic]=(counts[s.topic]||0)+1; });
  const populated = CATEGORIES.filter(c=>c.id!=='all' && counts[c.id]>0).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
  const all = CATEGORIES.find(c=>c.id==='all');
  const visible = [all, ...populated];
  list.innerHTML = visible.map(c=>{
    const n = c.id==='all' ? state.allStories.length : (counts[c.id]||0);
    const active = c.id===state.category ? ' active' : '';
    return `<button class="sheet-item${active}" data-cat="${esc(c.id)}"><span>${esc(c.label)}</span><span class="count">${n}</span></button>`;
  }).join('');
  list.onclick = e=>{
    const it = e.target.closest('.sheet-item');
    if(!it) return;
    state.category = it.dataset.cat;
    const meta = CATEGORIES.find(c=>c.id===state.category);
    document.getElementById('filter-current').textContent = meta ? meta.label : 'For You';
    closeSheet();
    applyFilter();
  };
}
function openSheet(){ document.getElementById('sheet').classList.add('open'); document.getElementById('sheet-backdrop').classList.add('open'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); document.getElementById('sheet-backdrop').classList.remove('open'); }

// ─── render feed ───────────────────────────────────────────────────
function applyFilter(){
  const base = state.category==='all' ? [...state.allStories] : state.allStories.filter(s=>s.topic===state.category);
  state.filtered = interleaveByShow(base);
  state.currentIndex = 0;
  // tear down players
  state.players.forEach(v=>{ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(_){} });
  state.players.clear();
  renderFeed();
  document.getElementById('feed').scrollTo({top:0});
  setTimeout(()=> activateStory(0), 60);
}

function slideInner(s, idx){
  const show = state.shows[s.show_name] || {};
  const artwork = show.artwork_url || '';
  const ini = initials(s.show_name);
  const len = (s.clip_end_seconds && s.clip_start_seconds) ? (s.clip_end_seconds - s.clip_start_seconds) : 60;
  const mm = Math.floor(len/60), ssx = len%60;
  const dur = mm>0 ? `${mm}:${String(ssx).padStart(2,'0')}` : `0:${String(ssx).padStart(2,'0')}`;
  const headline = esc(s.headline||'');
  const quoteLine = firstSentence(s.quote, 110);
  const showLabel = esc(s.show_name||'') + (s.episode ? ' · ' + esc(truncate(s.episode,28)) : '');
  const artStyle = artwork ? `background-image:url('${esc(artwork)}')` : '';

  // editorial panel content
  const fullSummary = esc(s.summary||'');
  const epSummary = (typeof s.episode_summary==='string' && s.episode_summary.trim()) ? esc(s.episode_summary.trim()) : '';
  const keyPoints = Array.isArray(s.episode_key_points) ? s.episode_key_points.filter(k=>typeof k==='string'&&k.trim()) : [];
  const kpHtml = keyPoints.length ? `<div class="panel-label">Key moments</div><ul class="panel-kp">${keyPoints.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>` : '';
  const fullQuote = s.quote ? esc(s.quote) : '';

  return `
    <div class="video-zone" id="vzone-${idx}">
      <div class="video-poster ${artwork?'':'fallback'}" style="${artStyle}"></div>
      <div class="tap-zone" data-tap="${idx}"></div>
      <div class="play-hint">▶</div>
      <div class="clip-dur">▸ ${dur}</div>
      <div class="v-progress"><div class="v-progress-fill" id="vprog-${idx}"></div></div>
    </div>

    <div class="edit-zone">
      <div class="show-pill">
        <div class="art" style="${artStyle}">${artwork?'':ini}</div>
        <div class="txt">${showLabel}</div>
      </div>
      <div class="cat-line"><div class="bar"></div><div class="cat">${esc(s.topic||'Story')}</div></div>
      <div class="headline">${headline}</div>
      ${quoteLine ? `<div class="quote"><div class="bar"></div><div class="txt">"${esc(quoteLine)}"</div></div>` : ''}
    </div>

    <div class="action-row">
      <div class="action-left">
        <button class="act-btn eg-bookmark" data-story-id="${s.id}" aria-label="Save story">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 H18 V20 L12 16 L6 20 Z"/></svg>
        </button>
        <button class="act-btn" data-share="${s.id}" data-headline="${esc((s.headline||'').replace(/"/g,'&quot;'))}" aria-label="Share story">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <a class="act-btn" href="${buildStoryUrl(s.id, s.headline)}#react" aria-label="React on Egleze">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V4a1.4 1.4 0 0 1 2.8 0v4.5"/><path d="M10.8 8.8V2.6a1.4 1.4 0 0 1 2.8 0v6"/><path d="M13.6 3.4a1.4 1.4 0 0 1 2.8 0v9.8c0 3.8-2.3 6.6-5.8 6.6-2.6 0-4.3-1.3-5.5-3.6l-2-3.6a1.35 1.35 0 0 1 2.3-1.4l1.8 2.8"/><path d="M9.5 22h3"/></svg>
        </a>
        ${s.source_url ? `<a class="act-btn" href="${esc(s.source_url)}" target="_blank" rel="noopener" aria-label="Watch source on YouTube">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>
        </a>` : ''}
      </div>
      <div class="swipe-hint" data-hint><span class="c1">‹</span><span class="c2">‹</span></div>
    </div>

    <!-- editorial panel (Phase 1b) -->
    <div class="edit-panel">
      <div class="panel-head">
        <button class="panel-back" data-back="${idx}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          back to video
        </button>
      </div>
      <div class="panel-body">
        <div class="panel-headline">${headline}</div>
        ${fullQuote ? `<div class="panel-quote"><div class="bar"></div><div class="txt">"${esc(fullQuote)}"</div></div>` : ''}
        ${fullSummary ? `<div class="panel-label">The story</div><div class="panel-summary">${fullSummary}</div>` : ''}
        ${epSummary ? `<div class="panel-label">From this episode</div><div class="panel-summary">${epSummary}</div>` : ''}
        ${kpHtml}
        <a class="panel-cta" href="${buildStoryUrl(s.id, s.headline)}">Read on Egleze →</a>
      </div>
    </div>`;
}

function renderFeed(){
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  if(state.filtered.length === 0){
    feed.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  // SLIDE VIRTUALIZATION: render an empty full-height shell for EVERY story
  // (cheap — one div each, scroll-snap works across all of them), then
  // hydrate only the slides near the viewport with real content + video.
  feed.innerHTML = state.filtered.map((s,i)=>
    `<div class="story shell" data-idx="${i}" data-id="${s.id}"></div>`
  ).join('');
  attachObserver();
  hydrateWindow(0);
}

// Fill a shell with the real story content (text zone + action row + panel).
function hydrateSlide(idx){
  const el = document.querySelector(`.story[data-idx="${idx}"]`);
  if(!el || !el.classList.contains('shell')) return;  // already hydrated or gone
  const s = state.filtered[idx];
  if(!s) return;
  el.classList.remove('shell');
  el.innerHTML = slideInner(s, idx);
  wireSlideEvents(el, idx);
}

// Empty a slide back to a shell (frees DOM + video).
function dehydrateSlide(idx){
  const el = document.querySelector(`.story[data-idx="${idx}"]`);
  if(!el || el.classList.contains('shell')) return;
  destroyVideo(idx);
  el.classList.add('shell');
  el.classList.remove('video-ready','paused','panel-open');
  el.innerHTML = '';
}

// Hydrate slides within a window of `center`, dehydrate the rest.
const SLIDE_WINDOW = 3;  // hydrate current ±3 slides
function hydrateWindow(center){
  const lo = Math.max(0, center - SLIDE_WINDOW);
  const hi = Math.min(state.filtered.length - 1, center + SLIDE_WINDOW);
  state.filtered.forEach((s,i)=>{
    const el = document.querySelector(`.story[data-idx="${i}"]`);
    if(!el) return;
    const isShell = el.classList.contains('shell');
    if(i >= lo && i <= hi){
      if(isShell) hydrateSlide(i);
    } else {
      if(!isShell) dehydrateSlide(i);
    }
  });
}

// ─── VIRTUALIZED VIDEO WINDOW ──────────────────────────────────────
// Only a handful of <video> elements exist at once. As the current index
// changes, we create videos for slides within WINDOW of current, and
// destroy any outside it. This keeps memory flat whether the feed has
// 50 stories or 50,000.
const WINDOW_AHEAD = 2;   // how many slides ahead to preload
const WINDOW_BEHIND = 1;  // how many behind to keep

function ensureVideo(idx){
  const story = state.filtered[idx];
  if(!story) return null;
  const zone = document.getElementById(`vzone-${idx}`);
  if(!zone) return null;
  let video = zone.querySelector('video');
  if(video) return video;  // already exists

  video = document.createElement('video');
  video.id = `video-${idx}`;
  video.className = 'story-video';
  video.src = cleanClipUrl(story.id);
  video.playsInline = true;
  video.setAttribute('playsinline','');
  video.setAttribute('webkit-playsinline','');
  video.muted = true;
  video.preload = 'metadata';
  // insert as the FIRST child so poster/tap-zone overlay it
  zone.insertBefore(video, zone.firstChild);
  state.players.set(story.id, video);
  wireVideoEvents(idx, video);
  return video;
}

function destroyVideo(idx){
  const story = state.filtered[idx];
  if(!story) return;
  const zone = document.getElementById(`vzone-${idx}`);
  if(!zone) return;
  const video = zone.querySelector('video');
  if(video){
    try{ video.pause(); video.removeAttribute('src'); video.load(); }catch(_){}
    video.remove();
  }
  state.players.delete(story.id);
  const el = document.querySelector(`.story[data-idx="${idx}"]`);
  if(el) el.classList.remove('video-ready');
}

function updateWindow(center){
  const lo = Math.max(0, center - WINDOW_BEHIND);
  const hi = Math.min(state.filtered.length - 1, center + WINDOW_AHEAD);
  // destroy anything outside [lo,hi]
  state.filtered.forEach((s,i)=>{
    if(i < lo || i > hi){
      const zone = document.getElementById(`vzone-${i}`);
      if(zone && zone.querySelector('video')) destroyVideo(i);
    }
  });
  // create anything inside [lo,hi]
  for(let i=lo; i<=hi; i++) ensureVideo(i);
}

// ─── playback ──────────────────────────────────────────────────────
function activateStory(idx){
  const story = state.filtered[idx];
  if(!story) return;
  // make sure this slide (and its neighbors) are hydrated before we touch video
  hydrateWindow(idx);
  const el = document.querySelector(`.story[data-idx="${idx}"]`);
  if(!el) return;
  state.currentIndex = idx;

  // maintain the sliding window of live videos around this index
  updateWindow(idx);

  // pause every video except the active one
  state.players.forEach((v,id)=>{ if(id!==story.id){ try{ v.pause(); v.currentTime=0; }catch(_){} } });

  const video = ensureVideo(idx);
  if(!video) return;
  try{ video.currentTime=0; }catch(_){}
  video._played = false;
  el.classList.remove('paused');

  if(!state.soundUnlocked){
    video.muted = true;
    const p = video.play();
    if(p&&p.catch) p.catch(()=>{});
  } else {
    video.muted = false;
    const p = video.play();
    if(p&&p.catch) p.catch(()=>{ video.muted=true; const r=video.play(); if(r&&r.catch)r.catch(()=>{}); });
  }
}

function wireVideoEvents(idx, video){
  video.addEventListener('loadeddata', ()=>{
    const el = document.querySelector(`.story[data-idx="${idx}"]`);
    if(el) el.classList.add('video-ready');
  });
  video.addEventListener('timeupdate', ()=>{
    const f = document.getElementById(`vprog-${idx}`);
    if(!f || !video.duration) return;
    f.style.width = Math.min(100,(video.currentTime/video.duration)*100)+'%';
  });
  video.addEventListener('playing', ()=>{ video._played = true; });
  video.addEventListener('ended', ()=>{
    if(!video._played || video.currentTime < 1) return;
    if(document.querySelector('.story.panel-open')) return;
    advanceTo(idx+1);
  });
  video.addEventListener('error', ()=>{
    if(!video._played){
      const cur = document.querySelector('.story[data-idx="'+idx+'"]');
      if(cur && parseInt(cur.dataset.idx,10)===state.currentIndex) setTimeout(()=>advanceTo(idx+1), 800);
    }
  });
}

function advanceTo(idx){
  const next = document.querySelector(`.story[data-idx="${idx}"]`);
  if(next) next.scrollIntoView({behavior:'smooth'});
}

// ─── tap = pause/play; first tap unlocks sound ─────────────────────
function onTap(idx){
  const story = state.filtered[idx];
  if(!story) return;
  const video = state.players.get(story.id);
  const el = document.querySelector(`.story[data-idx="${idx}"]`);
  if(!video) return;

  if(!state.soundUnlocked){
    state.soundUnlocked = true;
    try{ video.muted=false; const p=video.play(); if(p&&p.catch)p.catch(()=>{}); }catch(_){}
    if(el) el.classList.remove('paused');
    return;
  }
  try{
    if(video.paused || video.ended){
      video.muted=false; const p=video.play(); if(p&&p.catch)p.catch(()=>{});
      if(el) el.classList.remove('paused');
    } else {
      video.pause();
      if(el) el.classList.add('paused');
    }
  }catch(_){}
}

// ─── editorial panel open/close ────────────────────────────────────
function openPanel(idx){
  const el = document.querySelector(`.story[data-idx="${idx}"]`);
  if(!el) return;
  el.classList.add('panel-open');
  // pause the video while reading
  const story = state.filtered[idx];
  const video = story && state.players.get(story.id);
  if(video){ try{ video.pause(); }catch(_){} }
  if(el) el.classList.add('paused');
  dismissSwipeHint();
}
function closePanel(idx){
  const el = document.querySelector(`.story[data-idx="${idx}"]`);
  if(!el) return;
  el.classList.remove('panel-open');
  // resume video
  const story = state.filtered[idx];
  const video = story && state.players.get(story.id);
  if(video){ try{ video.muted=!state.soundUnlocked?true:false; const p=video.play(); if(p&&p.catch)p.catch(()=>{}); el.classList.remove('paused'); }catch(_){} }
}
function dismissSwipeHint(){
  if(state.swipeHintDismissed) return;
  state.swipeHintDismissed = true;
  document.querySelectorAll('.swipe-hint').forEach(h=> h.classList.add('gone'));
}

// ─── per-story event wiring (taps, swipe, buttons) ─────────────────
// Wire events for a SINGLE hydrated slide (called from hydrateSlide).
function wireSlideEvents(el, idx){
  // tap zone (pause/play)
  const tz = el.querySelector('.tap-zone');
  if(tz) tz.addEventListener('click', ()=> onTap(idx));
  // panel back button
  const back = el.querySelector('[data-back]');
  if(back) back.addEventListener('click', e=>{ e.stopPropagation(); closePanel(idx); });
  // share button
  const sh = el.querySelector('[data-share]');
  if(sh) sh.addEventListener('click', e=>{ e.stopPropagation(); e.preventDefault(); shareStory(sh.dataset.share, sh.dataset.headline); });
  // horizontal swipe (left = open panel, right = close)
  let x0=null, y0=null, t0=0;
  el.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now();
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0===null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0=null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.8 && (Date.now()-t0) < 600){
      if(dx < 0) openPanel(idx);
      else closePanel(idx);
    }
  }, {passive:true});
}

// ─── share ─────────────────────────────────────────────────────────
async function shareStory(id, headline){
  const url = 'https://egleze.com' + buildStoryUrl(id, headline);
  if(navigator.share){
    try{ await navigator.share({ title: headline||'Egleze', url }); }catch(_){}
  } else {
    try{ await navigator.clipboard.writeText(url); alert('Link copied'); }catch(_){}
  }
}

// ─── scroll observer (activate the story in view) ──────────────────
function attachObserver(){
  const feed = document.getElementById('feed');
  if(state._obs){ try{ state._obs.disconnect(); }catch(_){} }
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting && en.intersectionRatio > 0.6){
        const idx = parseInt(en.target.dataset.idx,10);
        // hydrate the window around this slide (creates content + videos),
        // then activate it. hydrateWindow also dehydrates far slides.
        hydrateWindow(idx);
        if(idx !== state.currentIndex){
          activateStory(idx);
        }
      }
    });
  }, { root: feed, threshold:[0.6] });
  // observe the shells (they persist across hydration — we only swap innerHTML
  // and toggle the .shell class, never replace the .story element itself).
  document.querySelectorAll('.story').forEach(st=> obs.observe(st));
  state._obs = obs;
}

// ─── sound toggle (simple mute/unmute for now) ─────────────────────
function setupSoundToggle(){
  const btn = document.getElementById('sound-btn');
  btn.addEventListener('click', ()=>{
    state.soundUnlocked = true;
    const story = state.filtered[state.currentIndex];
    const v = story && state.players.get(story.id);
    if(v){ try{ v.muted = !v.muted; btn.textContent = v.muted ? '🔇' : '📺'; if(!v.muted){ const p=v.play(); if(p&&p.catch)p.catch(()=>{}); } }catch(_){} }
  });
}

// ─── init ──────────────────────────────────────────────────────────
async function init(){
  setupSoundToggle();
  document.getElementById('filter-btn').addEventListener('click', openSheet);
  document.getElementById('sheet-backdrop').addEventListener('click', closeSheet);
  document.getElementById('empty-all').addEventListener('click', ()=>{
    state.category='all';
    document.getElementById('filter-current').textContent='For You';
    applyFilter();
  });

  await Promise.all([loadShows(), loadStories()]);
  renderCategories();
  applyFilter();
  document.getElementById('loading').classList.add('hidden');
}

init();
</script>
