<style>
:root{--red:#bb1919;--red-deep:#8a1414;--gold:#d6c79e;--ink:#1a1a1a;--bg:#000}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;height:100dvh;background:var(--bg);color:#fff;
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  overflow:hidden;position:fixed;inset:0;width:100%;
}

.app{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 20%,#1a1208 0%,#0a0a0a 50%,#000 100%);
}
@media(min-width:768px){
  .app::before{
    content:"📱 Best on phone — desktop preview shown";
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    color:#fff;background:rgba(0,0,0,0.7);
    padding:8px 16px;border-radius:20px;font-size:12px;z-index:1000;
    backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
  }
}
.shell{width:100%;height:100%;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
@media(min-width:768px){
  .shell{
    width:420px;height:840px;border-radius:42px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.8),0 0 90px rgba(187,25,25,0.08),0 0 0 14px #1a1a1a,0 0 0 16px #2a2a2a;
  }
}

/* HEADER */
.shorts-header{
  position:absolute;top:0;left:0;right:0;
  padding:max(env(safe-area-inset-top),14px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:30;background:linear-gradient(180deg,rgba(0,0,0,0.85),rgba(0,0,0,0));
  pointer-events:none;
}
.shorts-header > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px}
.brand-e{
  width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;
  font-family:'Playfair Display',serif;font-weight:900;font-size:20px;
  display:flex;align-items:center;justify-content:center;
}
.brand-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand-name em{font-style:italic;color:var(--gold);font-weight:400}
.icon-btn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;font-size:18px;
  border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(10px);cursor:pointer;
  transition:transform .15s ease;
}
.icon-btn:active{transform:scale(0.9)}

/* CATEGORY STRIP */
.cat-strip{
  position:absolute;top:calc(max(env(safe-area-inset-top),14px) + 54px);left:0;right:0;
  display:flex;gap:6px;overflow-x:auto;padding:4px 14px;z-index:25;
  scrollbar-width:none;
}
.cat-strip::-webkit-scrollbar{display:none}
.cat-pill{
  flex-shrink:0;padding:7px 14px;
  font-family:'Roboto Condensed',sans-serif;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
  color:#fff;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);border-radius:20px;
  white-space:nowrap;cursor:pointer;backdrop-filter:blur(10px);font-weight:500;transition:all .15s ease;
}
.cat-pill.active{background:var(--red);border-color:var(--red);font-weight:700}
.cat-pill:active{transform:scale(0.95)}
.cat-pill .count{display:inline-block;margin-left:4px;font-size:9px;opacity:0.6;font-weight:400}
.cat-pill.active .count{opacity:0.85}

/* FEED */
.feed{
  position:absolute;inset:0;z-index:5;
  scroll-snap-type:y mandatory;overflow-y:scroll;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.feed::-webkit-scrollbar{display:none}
.story{
  height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;display:flex;flex-direction:column;overflow:hidden;background:#000;
}

.story .poster{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:brightness(0.5) blur(2px);z-index:1;
}
.story .poster.fallback{background:linear-gradient(135deg,#1f1612 0%,#3a2818 50%,#0d0a07 100%)}

/* per-story iframe lives here, fills the story */
.story .yt-mount{
  position:absolute;inset:0;z-index:2;
  background:#000;opacity:0;
  transition:opacity .25s ease;
}
.story.video-ready .yt-mount{opacity:1}
.story .yt-mount iframe{width:100%;height:100%;border:0}

/* AUDIO MODE: hide video, show artwork in middle */
.audio-mode .story .yt-mount{opacity:0}
.story .audio-art{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  width:240px;height:240px;
  background-size:cover;background-position:center;
  border-radius:18px;
  box-shadow:0 30px 60px rgba(0,0,0,0.6);
  z-index:3;display:none;border:2px solid rgba(214,199,158,0.3);
}
.audio-mode .story.active .audio-art{display:block}
.story .audio-art.fallback{background:linear-gradient(135deg,var(--red) 0%,var(--red-deep) 100%)}

/* gradient overlay for readability — sits BELOW iframe; comes back ABOVE for body legibility */
.story .overlay{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,0.85) 75%,rgba(0,0,0,0.95) 100%);
}

/* MOBILE TAP-TO-ADVANCE: invisible button covering main video area, sits ABOVE iframe so taps go to us */
.tap-zone{
  position:absolute;left:0;right:0;
  top:calc(max(env(safe-area-inset-top),14px) + 110px);
  bottom:200px;
  z-index:6;
  cursor:pointer;background:transparent;
  display:none;
}
@media(max-width:767px){.tap-zone{display:block}}

.clip-dur{
  position:absolute;top:calc(max(env(safe-area-inset-top),14px) + 100px);left:18px;z-index:7;
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(0,0,0,0.6);color:#fff;
  font-family:'Roboto Condensed',sans-serif;font-size:10px;letter-spacing:1px;
  padding:4px 9px;border-radius:3px;backdrop-filter:blur(10px);
}
.story .progress{
  position:absolute;top:calc(max(env(safe-area-inset-top),14px) + 94px);right:18px;
  width:120px;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;
  z-index:7;overflow:hidden;
}
.story .progress-fill{height:100%;background:var(--red);width:0%;transition:width .2s linear}

.story .body{
  position:absolute;bottom:0;left:0;right:80px;
  padding:18px 18px calc(max(env(safe-area-inset-bottom),12px) + 12px);
  color:#fff;z-index:8;
}
.topic-line{
  display:inline-block;margin-bottom:12px;
  font-family:'Roboto Condensed',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;
  color:var(--gold);padding:4px 9px;background:rgba(0,0,0,0.6);border-left:3px solid var(--red);
}
.headline{
  font-family:'Playfair Display',serif;font-weight:700;font-size:21px;line-height:1.18;
  margin-bottom:10px;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,0.7);
}
.show-line{
  font-family:'Roboto Condensed',sans-serif;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
  color:#e6dfd6;margin-bottom:12px;
}
.show-line strong{color:#fff;font-weight:700}
.summary{
  font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.45;color:#dfd6c8;
  margin-bottom:14px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.ctas{display:flex;gap:8px;flex-wrap:wrap}
.cta{
  display:inline-flex;align-items:center;gap:6px;padding:8px 13px;
  font-family:'Roboto Condensed',sans-serif;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;
  border-radius:20px;cursor:pointer;border:none;color:#fff;text-decoration:none;
}
.cta.primary{background:var(--red)}
.cta.secondary{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(10px)}
.cta:active{transform:scale(0.95)}

.actions{
  position:absolute;right:14px;bottom:max(env(safe-area-inset-bottom),12px);z-index:8;
  display:flex;flex-direction:column;gap:14px;align-items:center;padding-bottom:120px;
}
.action-btn{
  width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,0.55);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);transition:transform .15s ease;
}
.action-btn:active{transform:scale(0.85)}
.action-btn.show-mark{
  background-size:cover;background-position:center;border:2px solid #fff;
  font-family:'Playfair Display',serif;font-weight:900;
}
.action-label{font-family:'Roboto Condensed',sans-serif;font-size:9px;letter-spacing:.6px;color:#fff;text-align:center;margin-top:-8px}

/* MOBILE-ONLY tap hint that appears on first story */
.tap-hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:9;color:rgba(255,255,255,0.9);
  font-family:'DM Sans',sans-serif;font-size:13px;text-align:center;pointer-events:none;
  background:rgba(0,0,0,0.6);padding:10px 16px;border-radius:24px;
  backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);
  opacity:0;animation:hint-fade 4s ease 1s forwards;display:none;
}
@media(max-width:767px){.tap-hint{display:block}}
@keyframes hint-fade{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}

/* Play indicator on stories that haven't started — only on mobile */
.play-hint{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  z-index:9;width:80px;height:80px;
  border-radius:50%;background:rgba(0,0,0,0.55);
  display:none;align-items:center;justify-content:center;
  color:#fff;font-size:32px;backdrop-filter:blur(10px);
  border:2px solid rgba(255,255,255,0.3);
  pointer-events:none;
  animation:play-pulse 2s ease-in-out infinite;
}
@media(max-width:767px){
  .story.active:not(.has-played) .play-hint{display:flex}
}
@keyframes play-pulse{50%{transform:translate(-50%,-50%) scale(1.05);opacity:0.7}}

/* LOADING */
.loading{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;color:#fff;background:#000;
}
.loading .brand-e{width:54px;height:54px;font-size:32px;margin-bottom:18px;animation:pulse 1.4s infinite}
.loading p{font-family:'Roboto Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
@keyframes pulse{50%{opacity:0.4;transform:scale(0.95)}}

/* EMPTY STATE */
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px;color:#fff;z-index:40;
}
.empty h2{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:12px}
.empty p{color:#bcb09a;font-size:14px;line-height:1.6;margin-bottom:18px}

/* INACTIVE STORIES are dimmed */
.story:not(.active) .body, .story:not(.active) .actions{opacity:0.4;transition:opacity .3s ease}
.story.active .body, .story.active .actions{opacity:1}

/* TAP TO START OVERLAY */
.tap-unmute{
  position:absolute;inset:0;z-index:200;background:rgba(0,0,0,0.85);
  display:flex;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(20px);
}
.tap-unmute.hidden{display:none}
.tap-card{text-align:center;color:#fff;max-width:300px}
.tap-card .speaker{font-size:54px;margin-bottom:16px;animation:speaker-pulse 1.5s ease-in-out infinite}
@keyframes speaker-pulse{50%{transform:scale(1.15)}}
.tap-card h3{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;letter-spacing:-0.3px;margin-bottom:10px}
.tap-card p{font-size:13px;line-height:1.5;color:#bcb09a;margin-bottom:18px}
.tap-card .cta{margin:0 auto;display:inline-flex;font-size:11px;padding:12px 24px}

/* TOAST for sound mode change */
.sound-toast{
  position:absolute;top:calc(max(env(safe-area-inset-top),14px) + 60px);right:18px;z-index:35;
  background:rgba(0,0,0,0.85);color:#fff;
  font-family:'Roboto Condensed',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;
  padding:6px 12px;border-radius:14px;
  opacity:0;transform:translateY(-6px);transition:all .25s ease;
  pointer-events:none;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);
}
.sound-toast.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="shell" id="shell">

    <div class="shorts-header">
      <div class="brand">
        <div class="brand-e">E</div>
        <div class="brand-name">Egleze<em>Shorts</em></div>
      </div>
      <button class="icon-btn" id="sound-toggle" title="Sound mode">📺</button>
    </div>

    <div class="sound-toast" id="sound-toast">Video + Sound</div>
    <div class="cat-strip" id="cat-strip"></div>

    <div class="loading" id="loading">
      <div class="brand-e">E</div>
      <p>Loading conversations…</p>
    </div>

    <div class="feed" id="feed"></div>

    <div class="empty" id="empty" style="display:none">
      <div class="brand-e" style="width:54px;height:54px;font-size:32px;margin-bottom:18px"></div>
      <h2>No stories in this category</h2>
      <p>Try a different category, or come back later — new conversations land throughout the day.</p>
      <button class="cta primary" onclick="document.querySelector('.cat-pill[data-cat=all]').click()">View all</button>
    </div>

    <div class="tap-unmute" id="tap-unmute">
      <div class="tap-card">
        <div class="speaker">🔊</div>
        <h3>Tap to start with sound</h3>
        <p>One tap unlocks audio for the session.</p>
        <button class="cta primary" id="unmute-btn">▸ Start watching</button>
      </div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// EGLEZE SHORTS V2 — clean rebuild, per-story iframe
// ═══════════════════════════════════════════════════════════════════

const SUPABASE_URL = 'https://kerijdhiasrvaxssjqqg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlcmlqZGhpYXNydmF4c3NqcXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjIxOTksImV4cCI6MjA5MzE5ODE5OX0.tyTa3XkkGh8bGWPIyGKNABf0n04rPiEnyTbaxjNFzLg';

const CATEGORIES = [
  { id: 'all', label: 'For You', emoji: '' },
  { id: 'AI & Tech', label: 'AI & Tech', emoji: '' },
  { id: 'Combat & UFC', label: 'Combat & UFC', emoji: '' },
  { id: 'Comedy', label: 'Comedy', emoji: '' },
  { id: 'Consciousness & Medicine', label: 'Consciousness & Medicine', emoji: '' },
  { id: 'Controversial', label: 'Controversial', emoji: '' },
  { id: 'Crime & Justice', label: 'Crime & Justice', emoji: '' },
  { id: 'Debates', label: 'Debates', emoji: '' },
  { id: 'Education & Learning', label: 'Education & Learning', emoji: '' },
  { id: 'Energy & Climate', label: 'Energy & Climate', emoji: '' },
  { id: 'Entertainment', label: 'Entertainment', emoji: '' },
  { id: 'Espionage', label: 'Espionage', emoji: '' },
  { id: 'Faith & Spirituality', label: 'Faith & Spirituality', emoji: '' },
  { id: 'Geopolitics', label: 'Geopolitics', emoji: '' },
  { id: 'Health, Longevity & Biohacking', label: 'Health & Longevity', emoji: '' },
  { id: 'History', label: 'History', emoji: '' },
  { id: 'Media & Journalism', label: 'Media & Journalism', emoji: '' },
  { id: 'Military', label: 'Military', emoji: '' },
  { id: 'Money', label: 'Money', emoji: '' },
  { id: 'Monologues', label: 'Monologues', emoji: '' },
  { id: 'Politics', label: 'Politics', emoji: '' },
  { id: 'Psychology', label: 'Psychology', emoji: '' },
  { id: 'Relationships & Family', label: 'Relationships & Family', emoji: '' },
  { id: 'Science', label: 'Science', emoji: '' },
  { id: 'Society', label: 'Society', emoji: '' },
  { id: 'Sports', label: 'Sports', emoji: '' },
  { id: 'UFO & Paranormal', label: 'UFO & Paranormal', emoji: '' }
];

const SOUND_MODES = [
  { id: 'video',  icon: '📺', label: 'Video + Sound' },
  { id: 'audio',  icon: '🎧', label: 'Audio Only' },
  { id: 'silent', icon: '🔇', label: 'Silent' }
];

const state = {
  allStories: [],
  shows: {},
  filteredStories: [],
  currentCategory: 'all',
  currentIndex: 0,
  soundMode: 'video',
  soundUnlocked: false,
  players: new Map(),       // story.id -> YT.Player
  ytApiReady: false,
  pendingPlayerCreations: [],
};

async function init() {
  setupSoundToggle();
  setupUnmuteOverlay();
  loadYouTubeAPI();
  await Promise.all([loadShows(), loadStories()]);
  renderCategories();
  applyFilter();
  document.getElementById('loading').style.display = 'none';
  setupScrollObserver();
}

// ─── DATA ──────────────────────────────────────────────────────────
async function fetchSupabase(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Accept-Profile': 'public' }
  });
  if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
  return res.json();
}
async function loadShows() {
  try {
    const shows = await fetchSupabase('shows?select=name,artwork_url,website_url&active=eq.true');
    shows.forEach(s => state.shows[s.name] = s);
  } catch (e) { console.warn('[shorts] shows failed:', e); }
}
async function loadStories() {
  try {
    const path = `stories?select=*&status=eq.approved&clip_start_seconds=not.is.null&clip_end_seconds=not.is.null&source_url=not.is.null&order=updated_at.desc.nullslast&limit=500`;
    state.allStories = await fetchSupabase(path);
  } catch (e) { console.error('[shorts] stories failed:', e); state.allStories = []; }
}

// ─── CATEGORIES ────────────────────────────────────────────────────
function renderCategories() {
  const strip = document.getElementById('cat-strip');
  const counts = {};
  state.allStories.forEach(s => { if (s.topic) counts[s.topic] = (counts[s.topic] || 0) + 1; });
  // Filter to populated categories, then sort by count desc.
  // 'For You' (id: 'all') is pinned first so it's always the first pill.
  const populated = CATEGORIES.filter(c => c.id !== 'all' && counts[c.id] > 0);
  populated.sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
  const allEntry = CATEGORIES.find(c => c.id === 'all');
  const visible = allEntry ? [allEntry, ...populated] : populated;
  strip.innerHTML = visible.map(c => {
    const n = c.id === 'all' ? state.allStories.length : (counts[c.id] || 0);
    const lbl = c.emoji ? `${c.emoji} ${c.label}` : c.label;
    return `<div class="cat-pill ${c.id === 'all' ? 'active' : ''}" data-cat="${c.id}">${lbl} <span class="count">${n}</span></div>`;
  }).join('');
  strip.addEventListener('click', e => {
    const pill = e.target.closest('.cat-pill');
    if (!pill) return;
    [...strip.querySelectorAll('.cat-pill')].forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    state.currentCategory = pill.dataset.cat;
    applyFilter();
    pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  });
}
function applyFilter() {
  state.filteredStories = state.currentCategory === 'all'
    ? [...state.allStories]
    : state.allStories.filter(s => s.topic === state.currentCategory);
  state.currentIndex = 0;
  // Tear down all existing players when filter changes
  state.players.forEach(p => { try { p.destroy(); } catch(_) {} });
  state.players.clear();
  renderFeed();
  document.getElementById('feed').scrollTo({ top: 0 });
  // Activate first story
  setTimeout(() => activateStory(0), 50);
}

// ─── RENDER ────────────────────────────────────────────────────────
function renderFeed() {
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  if (state.filteredStories.length === 0) {
    feed.innerHTML = ''; empty.style.display = 'flex'; return;
  }
  empty.style.display = 'none';
  feed.innerHTML = state.filteredStories.map((s, i) => storyHTML(s, i)).join('');
  // First story marked active
  feed.querySelector('.story')?.classList.add('active');
}
function storyHTML(s, idx) {
  const show = state.shows[s.show_name] || {};
  const artwork = show.artwork_url || '';
  const ytId = extractYouTubeId(s.source_url);
  const initials = (s.show_name || 'E').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
  const len = (s.clip_end_seconds && s.clip_start_seconds) ? (s.clip_end_seconds - s.clip_start_seconds) : 60;
  const m = Math.floor(len/60), ss = len%60;
  const dur = m > 0 ? `${m}:${String(ss).padStart(2,'0')}` : `0:${String(ss).padStart(2,'0')}`;
  const summary = (s.summary || '').replace(/"/g,'&quot;');
  const headline = (s.headline || '').replace(/"/g,'&quot;');
  return `
    <div class="story" data-idx="${idx}" data-id="${s.id}" data-yt="${ytId || ''}" data-start="${s.clip_start_seconds||0}" data-end="${s.clip_end_seconds||0}">
      <div class="poster ${!artwork?'fallback':''}" style="${artwork?`background-image:url('${artwork}')`:''}"></div>
      <div class="yt-mount" id="yt-mount-${idx}"><div id="yt-player-${idx}"></div></div>
      <div class="audio-art ${!artwork?'fallback':''}" style="${artwork?`background-image:url('${artwork}')`:''}"></div>
      <div class="overlay"></div>
      <div class="tap-zone" onclick="onTapZone(${idx})"></div>
      <div class="play-hint">▶</div>
      ${idx === 0 ? '<div class="tap-hint">Tap to play · tap again to skip</div>' : ''}
      <div class="clip-dur">▸ ${dur}</div>
      <div class="progress"><div class="progress-fill" id="progress-${idx}"></div></div>
      <div class="actions">
        <div class="action-btn" title="Save">⊕</div>
        <div class="action-btn" title="Share" onclick="event.stopPropagation();shareStory(${s.id}, '${headline.replace(/'/g,"\\'")}')">↗</div>
        <div class="action-btn show-mark" title="${s.show_name}" style="${artwork?`background-image:url('${artwork}')`:`background:linear-gradient(135deg,#3a2818,#1a1208);font-size:14px;color:#fff;`}">${!artwork?initials:''}</div>
        <div class="action-label">Show</div>
      </div>
      <div class="body">
        <div class="topic-line">${s.topic || 'Story'}</div>
        <h2 class="headline">${headline}</h2>
        <div class="show-line"><strong>${s.show_name || ''}</strong>${s.episode ? ' · ' + truncate(s.episode, 50) : ''}</div>
        <p class="summary">${summary}</p>
        <div class="ctas">
          ${s.source_url ? `<a class="cta primary" href="${s.source_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▸ Watch full episode</a>` : ''}
          <a class="cta secondary" href="${buildStoryUrl(s.id, headline)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Read on Egleze</a>
        </div>
      </div>
    </div>
  `;
}
function truncate(s, n) { return s && s.length > n ? s.slice(0,n) + '…' : s; }
function extractYouTubeId(url) {
  if (!url) return null;
  const patterns = [/youtu\.be\/([a-zA-Z0-9_-]{11})/, /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/, /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/, /youtube\.com\/live\/([a-zA-Z0-9_-]{11})/, /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return null;
}

// ─── YOUTUBE API ──────────────────────────────────────────────────
function loadYouTubeAPI() {
  if (window.YT && window.YT.Player) { state.ytApiReady = true; return; }
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = () => {
    state.ytApiReady = true;
    while (state.pendingPlayerCreations.length) state.pendingPlayerCreations.shift()();
  };
}

// ─── ACTIVATE STORY (creates player, plays it) ─────────────────────
function activateStory(idx) {
  const story = state.filteredStories[idx];
  if (!story) return;
  const storyEl = document.querySelector(`.story[data-idx="${idx}"]`);
  if (!storyEl) return;
  
  // Mark active
  document.querySelectorAll('.story').forEach(s => s.classList.remove('active'));
  storyEl.classList.add('active');
  state.currentIndex = idx;

  // Pause all OTHER players
  state.players.forEach((p, id) => {
    if (id !== story.id) {
      try { p.pauseVideo(); } catch(_) {}
    }
  });

  // Create or resume this story's player
  const create = () => createPlayerForStory(idx, story);
  if (state.ytApiReady) create();
  else state.pendingPlayerCreations.push(create);
}

function createPlayerForStory(idx, story) {
  if (state.players.has(story.id)) {
    // Player exists, just play it
    try {
      const p = state.players.get(story.id);
      if (state.soundMode !== 'silent') {
        if (state.soundUnlocked) p.unMute();
        p.playVideo();
      }
    } catch(_) {}
    return;
  }
  const ytId = extractYouTubeId(story.source_url);
  if (!ytId) return;
  const start = story.clip_start_seconds || 0;
  const end = story.clip_end_seconds || (start + 60);
  
  new window.YT.Player(`yt-player-${idx}`, {
    videoId: ytId,
    playerVars: {
      autoplay: state.soundMode !== 'silent' ? 1 : 0,
      controls: 0, modestbranding: 1, playsinline: 1,
      mute: 1, // ALWAYS start muted (browser policy)
      start, end, rel: 0, iv_load_policy: 3,
      origin: window.location.origin
    },
    events: {
      onReady: e => {
        state.players.set(story.id, e.target);
        try { e.target.mute(); } catch(_) {}
        if (state.soundMode !== 'silent') {
          try { e.target.playVideo(); } catch(_) {}
          if (state.soundUnlocked) {
            try { e.target.unMute(); } catch(_) {}
          }
        }
        const storyEl = document.querySelector(`.story[data-idx="${idx}"]`);
        if (storyEl) storyEl.classList.add('video-ready');
        startProgressTimer(idx, start, end, story.id);
      },
      onStateChange: ev => {
        // Mark as played once it actually starts
        if (ev.data === window.YT.PlayerState.PLAYING) {
          const storyEl = document.querySelector(`.story[data-idx="${idx}"]`);
          if (storyEl) storyEl.classList.add('has-played');
        }
        if (ev.data === window.YT.PlayerState.ENDED) {
          // Verify we played to end (not insta-end from autoplay block)
          try {
            if (e_target_safe(ev) >= end - 1) advanceTo(idx + 1);
          } catch(_) {}
        }
      }
    }
  });
}
function e_target_safe(ev) {
  try { return ev.target.getCurrentTime(); } catch(_) { return 0; }
}

function startProgressTimer(idx, start, end, storyId) {
  const fill = document.getElementById(`progress-${idx}`);
  if (!fill) return;
  fill.style.width = '0%';
  const total = (end - start) || 60;
  const interval = setInterval(() => {
    const player = state.players.get(storyId);
    if (!player) { clearInterval(interval); return; }
    let cur;
    try { cur = player.getCurrentTime(); } catch(_) { return; }
    if (typeof cur !== 'number') return;
    const elapsed = Math.max(0, cur - start);
    const pct = Math.min(100, (elapsed / total) * 100);
    fill.style.width = pct + '%';
    if (elapsed >= total) {
      clearInterval(interval);
      try { player.pauseVideo(); } catch(_) {}
      // Auto-advance only on desktop with sound unlocked
      if (state.soundUnlocked && state.soundMode !== 'silent' && !isMobile()) {
        advanceTo(idx + 1);
      }
    }
    // Stop tracking if user navigated away
    const activeEl = document.querySelector('.story.active');
    if (!activeEl || parseInt(activeEl.dataset.idx, 10) !== idx) {
      clearInterval(interval);
    }
  }, 250);
}

function advanceTo(idx) {
  const next = document.querySelector(`.story[data-idx="${idx}"]`);
  if (next) next.scrollIntoView({ behavior: 'smooth' });
}

function isMobile() { return window.matchMedia('(max-width: 767px)').matches; }

// ─── TAP-ZONE HANDLER (mobile) ─────────────────────────────────────
function onTapZone(idx) {
  const story = state.filteredStories[idx];
  if (!story) return;

  // First-time tap on first story = unlock sound globally
  if (!state.soundUnlocked) {
    state.soundUnlocked = true;
    document.getElementById('tap-unmute')?.classList.add('hidden');
    const player = state.players.get(story.id);
    if (player) {
      try { player.unMute(); player.playVideo(); } catch(_) {}
    }
    return;
  }

  // Otherwise, decide: is current video playing? If not, play it. If yes, advance.
  const player = state.players.get(story.id);
  let isPlaying = false;
  if (player) {
    try {
      const s = player.getPlayerState();
      // YT.PlayerState: -1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued
      isPlaying = (s === window.YT.PlayerState.PLAYING || s === window.YT.PlayerState.BUFFERING);
    } catch(_) {}
  }

  if (!isPlaying && player) {
    // First tap on this story → play it (synchronous, counts as user gesture)
    try {
      player.unMute();
      player.playVideo();
    } catch(_) {}
    return;
  }

  // Already playing → advance to next
  advanceTo(idx + 1);
}

// ─── SCROLL OBSERVER ───────────────────────────────────────────────
function setupScrollObserver() {
  const feed = document.getElementById('feed');
  let scrollDebounce;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        const idx = parseInt(entry.target.dataset.idx, 10);
        if (idx === state.currentIndex) return;
        clearTimeout(scrollDebounce);
        scrollDebounce = setTimeout(() => activateStory(idx), 80);
      }
    });
  }, { root: feed, threshold: [0.6] });
  document.querySelectorAll('.story').forEach(s => obs.observe(s));
  const mo = new MutationObserver(() => {
    document.querySelectorAll('.story').forEach(s => obs.observe(s));
  });
  mo.observe(feed, { childList: true });
}

// ─── SOUND TOGGLE ──────────────────────────────────────────────────
function setupSoundToggle() {
  const btn = document.getElementById('sound-toggle');
  btn.addEventListener('click', () => {
    const i = SOUND_MODES.findIndex(m => m.id === state.soundMode);
    const next = SOUND_MODES[(i + 1) % SOUND_MODES.length];
    state.soundMode = next.id;
    btn.textContent = next.icon;
    showToast(next.label);
    document.getElementById('shell').classList.toggle('audio-mode', state.soundMode === 'audio');
    applySoundMode();
  });
}
function applySoundMode() {
  const story = state.filteredStories[state.currentIndex];
  if (!story) return;
  const player = state.players.get(story.id);
  if (!player) return;
  try {
    if (state.soundMode === 'silent') {
      player.mute();
      player.pauseVideo();
    } else {
      if (state.soundUnlocked) player.unMute();
      player.playVideo();
    }
  } catch(_) {}
}
function showToast(label) {
  const t = document.getElementById('sound-toast');
  t.textContent = label;
  t.classList.add('visible');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('visible'), 1500);
}

// ─── UNMUTE OVERLAY ────────────────────────────────────────────────
function setupUnmuteOverlay() {
  const overlay = document.getElementById('tap-unmute');
  document.getElementById('unmute-btn').addEventListener('click', () => {
    state.soundUnlocked = true;
    overlay.classList.add('hidden');
    // Unmute current player
    const story = state.filteredStories[state.currentIndex];
    const player = story && state.players.get(story.id);
    if (player) {
      try { player.unMute(); player.playVideo(); } catch(_) {}
    }
  });
}

// ─── SHARE ─────────────────────────────────────────────────────────
// Build the canonical /story/{id}-{slug} URL — same algorithm as
// /api/story.js so server-rendered share previews match the URL.
function slugifyHeadline(text) {
  if (!text) return '';
  return String(text)
    .toLowerCase()
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .substring(0, 80);
}

function buildStoryUrl(id, headline) {
  const slug = slugifyHeadline(headline);
  return slug
    ? `https://egleze.com/story/${id}-${slug}`
    : `https://egleze.com/story/${id}`;
}

function shareStory(id, headline) {
  const url = buildStoryUrl(id, headline);
  if (navigator.share) {
    navigator.share({ title: headline, url }).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(url);
    if (event && event.target) {
      const orig = event.target.textContent;
      event.target.textContent = '✓';
      setTimeout(() => event.target.textContent = orig, 1500);
    }
  }
}

init();
</script>
</body>
</html>
