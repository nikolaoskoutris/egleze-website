<body>
  <!-- EGLEZE-BUILD: account-panel + profile-btn + saved-feed -->
  <div id="boot"><div class="spin"></div><div id="boot-msg">Loading Egleze</div></div>
  <div id="cats" aria-label="Categories"></div>
  <div id="feed" aria-label="Egleze stories"></div>
  <div id="showpill" class="hidden"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span class="nm"></span><span class="sub">· auto-playing</span><button class="x" aria-label="Exit show"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="showgrid" aria-hidden="true">
    <div class="sg-head"><div class="sg-title">Shows</div><button class="sg-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sg-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="sg-input" type="text" placeholder="Search 100+ shows" autocomplete="off"></div>
    <div class="sg-grid" id="sg-grid"></div>
  </div>
  <div id="accountpanel" aria-hidden="true">
    <div class="ap-head"><div class="ap-title">Account</div><button class="ap-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="ap-body">
      <div class="ap-profile">
        <div class="ap-avatar" id="ap-initial">E</div>
        <div class="ap-id"><div class="ap-name" id="ap-name"></div><div class="ap-email" id="ap-email"></div></div>

      </div>
      <div class="ap-stats">
        <div class="ap-stat"><div class="ap-stat-n" id="ap-following-count">0</div><div class="ap-stat-l">Following</div></div>
        <button class="ap-stat ap-stat-btn" data-saved-play="1"><div class="ap-stat-n" id="ap-saved-count">0</div><div class="ap-stat-l">Saved \u25b8 play</div></button>
      </div>
      <div class="ap-sec-label">Following</div>
      <div class="ap-chips" id="ap-following"></div>
      <div class="ap-sec-label">Saved</div>
      <div class="ap-saved" id="ap-saved"></div>
    </div>

    function diversifyByShow(list){
      if(!list||list.length<3) return list||[];
      var groups={}, order=[];
      list.forEach(function(it){

        if(!groups[k]){ groups[k]=[]; order.push(k); }
        groups[k].push(it);

      if(order.length<2) return list;
      var out=[], remaining=list.length;
      while(remaining>0){
        for(var i=0;i<order.length;i++){
          var g=groups[order[i]];
          if(g&&g.length){ out.push(g.shift()); remaining--; }
        }
      }
      return out;
    }

          var F=window.egleze&&window.egleze.follows;

      feedOffset=list.length;
      if(list.length<PAGE) feedExhausted=true;
      feed.scrollTo({top:0});
      var first=feed.querySelector('.slide');

      try{ rows=await sb('stories?select=topic&'+CLIP_FILTER); }catch(e){ rows=[]; }
      var counts={};
      rows.forEach(function(r){ var t=r.topic; if(t) counts[t]=(counts[t]||0)+1; });
      var topics=Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }); // busiest topics first
      var bellOff='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
      var html='<button class="chip on" data-cat="all">All</button>';
      html+='<button class="chip chip-following" data-cat="__following__"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7-4.6-9.3-9C1 8.5 2.7 5 6.2 5c2 0 3.2 1.1 3.8 2 .6-.9 1.8-2 3.8-2 3.5 0 5.2 3.5 3.5 7-2.3 4.4-9.3 9-9.3 9z"/></svg>Following</button>';
      html+='<button class="chip chip-shows" data-cat="__shows__">Shows</button>';
      topics.forEach(function(t){
        html+='<button class="chip" data-cat="'+esc(t)+'"><span class="chip-lbl">'+esc(t)+'</span>'
          +'<span class="eg-follow chip-bell" data-follow-type="topic" data-follow-value="'+esc(t)+'" aria-label="Follow '+esc(t)+'">'+bellOff+'</span></button>';
      });
      bar.innerHTML=html;
      bar.addEventListener('click',function(e){
        if(e.target.closest&&e.target.closest('.eg-follow')) return; // follow handled by follows.js
        var c=e.target.closest&&e.target.closest('.chip'); if(!c)return;
        var cat=c.getAttribute('data-cat');
        if(cat==='__shows__'){ openShowGrid(); return; }
        bar.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
        c.classList.add('on');
        renderFeed(cat);
      });
      if(window.egleze&&window.egleze.follows) window.egleze.follows.sync();
    }

    function updateShowPill(filter){
      var pill=document.getElementById('showpill'); if(!pill) return;
      var nm=pill.querySelector('.nm'), sub=pill.querySelector('.sub');
      if(filter&&filter.indexOf('__show__:')===0){ nm.textContent=filter.slice(9); if(sub)sub.textContent='\u00b7 auto-playing'; pill.classList.remove('hidden'); }
      else if(filter==='__saved__'){ nm.textContent='Saved'; if(sub)sub.textContent='\u00b7 auto-playing'; pill.classList.remove('hidden'); }
      else { pill.classList.add('hidden'); }
    }
    async function updateAuthState(){
      var auth=window.egleze&&window.egleze.auth; if(!auth){ document.body.classList.remove('signed-in'); return; }
      var user=null; try{ user=await auth.getUser(); }catch(e){}
      document.body.classList.toggle('signed-in', !!user);
    }
    function openSignIn(){
      var e=window.egleze||{};
      if(e.ui&&e.ui.openSignIn) return e.ui.openSignIn();
      if(e.signin&&e.signin.open) return e.signin.open();
      if(e.auth&&e.auth.openSignIn) return e.auth.openSignIn();
      if(e.auth&&e.auth.signInWithGoogle) return e.auth.signInWithGoogle();
    }
    async function onProfileTap(){
      var auth=window.egleze&&window.egleze.auth; var user=null;
      if(auth){ try{ user=await auth.getUser(); }catch(e){} }
      if(user) openAccountPanel(); else openSignIn();
    }
    async function loadSavedRows(){
      var auth=window.egleze&&window.egleze.auth; if(!auth) return [];
      var user=null; try{ user=await auth.getUser(); }catch(e){} if(!user) return [];
      var db=auth.client; if(!db) return [];
      var res; try{ res=await db.from('user_saved_stories').select('story_id').eq('user_id',user.id); }catch(e){ return []; }
      var ids=(((res&&res.data)||[]).map(function(r){return r.story_id;})).filter(function(x){return x||x===0;});
      if(!ids.length) return [];
      var rows; try{ rows=await sb('stories?select=*&'+CLIP_FILTER+'&id=in.('+ids.join(',')+')&order=updated_at.desc.nullslast'); }catch(e){ rows=[]; }
      return rows||[];
    }
    function openAccountPanel(){
      var p=document.getElementById('accountpanel'); if(!p) return;
      p.classList.add('open'); p.setAttribute('aria-hidden','false'); renderAccountPanel();
    }
    function closeAccountPanel(){
      var p=document.getElementById('accountpanel'); if(!p) return;
      p.classList.remove('open'); p.setAttribute('aria-hidden','true');
    }
    async function renderAccountPanel(){
      var auth=window.egleze&&window.egleze.auth; if(!auth) return;
      var user=null; try{ user=await auth.getUser(); }catch(e){}
      if(!user){ closeAccountPanel(); openSignIn(); return; }
      var meta=user.user_metadata||{};
      var name=meta.name||meta.full_name||(user.email?user.email.split('@')[0]:'You');
      document.getElementById('ap-initial').textContent=(name||'E').trim().charAt(0).toUpperCase();
      document.getElementById('ap-name').textContent=name;
      document.getElementById('ap-email').textContent=user.email||'';
      var F=window.egleze&&window.egleze.follows;
      var fshows=F?Array.from(F.shows||[]):[], ftopics=F?Array.from(F.topics||[]):[];
      document.getElementById('ap-following-count').textContent=(fshows.length+ftopics.length);
      var chips='';
      fshows.forEach(function(n){ chips+='<button class="ap-chip" data-show="'+esc(n)+'">'+esc(n)+'</button>'; });
      ftopics.forEach(function(t){ chips+='<button class="ap-chip ap-chip-topic" data-topic="'+esc(t)+'">'+esc(t)+'</button>'; });
      document.getElementById('ap-following').innerHTML=chips||'<div class="ap-empty">Not following anything yet</div>';
      var rows=await loadSavedRows(); savedRows=rows;
      document.getElementById('ap-saved-count').textContent=rows.length;
      var sv='';
      rows.slice(0,8).forEach(function(s2){
        var sh=shows[s2.show_name]||{}; var art=sh.artwork_url;
        sv+='<button class="ap-saved-row" data-saved-play="1"><span class="ap-thumb" style="'+(art?('background-image:url(\''+esc(art)+'\')'):'')+'"></span><span class="ap-saved-head">'+esc(s2.headline||'')+'</span></button>';
      });
      document.getElementById('ap-saved').innerHTML=rows.length?sv:'<div class="ap-empty">No saved stories yet</div>';
    }
    function enterSavedFeed(){
      closeAccountPanel();
      var bar=document.getElementById('cats'); if(bar) bar.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
      renderFeed('__saved__');
    }
    function enterTopic(t){
      closeAccountPanel();
      var bar=document.getElementById('cats');
      if(bar) bar.querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-cat')===t); });
      renderFeed(t);
    }
    async function doSignOut(){
      var auth=window.egleze&&window.egleze.auth; if(auth){ try{ await auth.signOut(); }catch(e){} }
      savedRows=null; updateAuthState(); closeAccountPanel();
      var bar=document.getElementById('cats'); if(bar){ bar.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');}); var a=bar.querySelector('[data-cat="all"]'); if(a)a.classList.add('on'); }
      renderFeed('all');
    }
    function wireAccountUI(){
      var p=document.getElementById('accountpanel');
      if(p){
        p.addEventListener('click',function(e){
          if(e.target.closest('.ap-close')){ closeAccountPanel(); return; }
          if(e.target.closest('[data-signout]')){ doSignOut(); return; }
          var sc=e.target.closest('[data-show]'); if(sc){ closeAccountPanel(); enterShow(sc.getAttribute('data-show')); return; }
          var tc=e.target.closest('[data-topic]'); if(tc){ enterTopic(tc.getAttribute('data-topic')); return; }
          if(e.target.closest('[data-saved-play]')){ enterSavedFeed(); return; }
        });
      }
      var feed=document.getElementById('feed');
      if(feed) feed.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('[data-account]'); if(b){ e.preventDefault(); e.stopPropagation(); onProfileTap(); } });
      if(window.egleze&&window.egleze.auth&&window.egleze.auth.onChange){ window.egleze.auth.onChange(function(){ updateAuthState(); }); }
    }
    function insertSpillDivider(feed){
      var d=document.createElement('div'); d.className='spill-divider'; d.textContent='More from everyone'; feed.appendChild(d);
    }
    function exitShowMode(){
      updateShowPill('');
      var bar=document.getElementById('cats');
      if(bar){ bar.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');}); var a=bar.querySelector('[data-cat="all"]'); if(a)a.classList.add('on'); }
      renderFeed('all');
    }
    function enterShow(name){
      closeShowGrid();
      var bar=document.getElementById('cats'); if(bar) bar.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
      renderFeed('__show__:'+name);
    }
    function openShowGrid(){
      var g=document.getElementById('showgrid'); if(!g) return;
      g.classList.add('open'); g.setAttribute('aria-hidden','false');
      var inp=document.getElementById('sg-input'); if(inp) inp.value='';
      buildShowGrid('');
    }
    function closeShowGrid(){
      var g=document.getElementById('showgrid'); if(!g) return;
      g.classList.remove('open'); g.setAttribute('aria-hidden','true');
    }
    async function ensureShowCounts(){
      if(showCounts) return showCounts;
      var c={}, offset=0;
      for(var guard=0; guard<50; guard++){
        var rows;
        try{ rows=await sb('stories?select=show_name&'+CLIP_FILTER+'&order=updated_at.desc.nullslast&limit=1000&offset='+offset); }
        catch(e){ rows=[]; }
        if(!rows||!rows.length) break;
        rows.forEach(function(r){ var n=r.show_name; if(n) c[n]=(c[n]||0)+1; });
        if(rows.length<1000) break;
        offset+=rows.length;
      }
      showCounts=c; return c;
    }
    async function buildShowGrid(q){
      var grid=document.getElementById('sg-grid'); if(!grid) return;
      var counts=await ensureShowCounts();
      var names=Object.keys(shows).filter(function(n){ return counts[n]; });
      names.sort(function(a,b){ return (counts[b]||0)-(counts[a]||0); });
      var needle=(q||'').trim().toLowerCase();
      if(needle) names=names.filter(function(n){ return n.toLowerCase().indexOf(needle)>=0; });
      if(!names.length){ grid.innerHTML='<div class="sg-empty">No shows found</div>'; return; }
      grid.innerHTML=names.map(function(n){
        var sh=shows[n]||{}; var art=sh.artwork_url;
        var artHtml=art?('<div class="art" style="background-image:url('+esc(art)+')"></div>'):('<div class="art fallback"><span>'+esc(n)+'</span></div>');
        return '<div class="sg-tile" data-show="'+esc(n)+'">'+artHtml+'<div class="cap"><span class="t">'+esc(n)+'</span><span class="c">'+(counts[n]||0)+' clips</span></div></div>';
      }).join('');
    }
    function wireShowUI(){
      var g=document.getElementById('showgrid');
      if(g){
        g.addEventListener('click',function(e){
          if(e.target.closest('.sg-close')){ closeShowGrid(); return; }
          var tile=e.target.closest('.sg-tile'); if(tile){ enterShow(tile.getAttribute('data-show')); }
        });
        var inp=document.getElementById('sg-input'); if(inp) inp.addEventListener('input',function(){ buildShowGrid(inp.value); });
      }
      var pill=document.getElementById('showpill'); if(pill){ var x=pill.querySelector('.x'); if(x) x.addEventListener('click',function(){ exitShowMode(); }); }
    }
    function boot(m){var b=document.getElementById('boot-msg');if(b)b.textContent=m;}
    function bootDone(){var b=document.getElementById('boot');if(b)b.classList.add('gone');}

    async function start(){
      try{
        boot('Loading');
        (await sb('shows?select=name,artwork_url,website_url&active=eq.true')).forEach(function(x){shows[x.name]=x;});
        await Promise.all([ buildCats(), renderFeed('all') ]);
        bootDone();
        wireShowUI();
        wireAccountUI();
        updateAuthState();
        // infinite scroll: fetch the next page as the user nears the end
        var feed=document.getElementById('feed');
        feed.addEventListener('scroll',function(){
          if(feed.scrollHeight - feed.scrollTop - feed.clientHeight < feed.clientHeight*1.5) loadMore();
        },{passive:true});
        if(window.egleze&&window.egleze.reactions&&window.egleze.reactions.onChange){
          window.egleze.reactions.onChange(function(changedId){ var fn=renderMap[String(changedId)]; if(fn)fn(); });
        }
        if(window.egleze&&window.egleze.follows&&window.egleze.follows.onChange){
          window.egleze.follows.onChange(function(){ if(currentFilter==='__following__') renderFeed('__following__'); });
        }
      }catch(err){ console.error('[app-shorts] start failed',err); boot('Could not load — check connection'); }
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  })();
  </script>
</body>
</html>
