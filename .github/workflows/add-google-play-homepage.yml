name: Add Google Play homepage entry

on:
  push:
    branches:
      - homepage/google-play-badge
    paths:
      - scripts/add-google-play-homepage.js
      - .github/workflows/add-google-play-homepage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: homepage/google-play-badge
          fetch-depth: 0

      - name: Patch homepage
        run: node scripts/add-google-play-homepage.js

      - name: Commit prepared homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Google Play app link to homepage"
          git push origin HEAD:homepage/google-play-badge
