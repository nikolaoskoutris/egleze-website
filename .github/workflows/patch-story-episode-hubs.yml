name: Patch story pages for episode hubs

on:
  push:
    branches:
      - feature/episode-hubs
    paths:
      - .github/workflows/patch-story-episode-hubs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/episode-hubs
          fetch-depth: 0
      - run: node scripts/patch-story-episode-hubs.js
      - run: |
          if git diff --quiet -- api/story.js; then
            echo "Story renderer already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/story.js
          git commit -m "Link moment pages to canonical episode hubs"
          git push origin HEAD:feature/episode-hubs
