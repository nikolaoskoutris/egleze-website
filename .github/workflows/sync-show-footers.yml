name: Sync show footers

on:
  push:
    branches:
      - website/unify-show-footers
    paths:
      - scripts/sync-show-footers.js
      - .github/workflows/sync-show-footers.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website/unify-show-footers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copy homepage footer to show pages
        run: node scripts/sync-show-footers.js
      - name: Commit generated show-page changes
        run: |
          if git diff --quiet -- shows.html show.html; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows.html show.html
          git commit -m "Synchronize show page footers with homepage"
          git push origin HEAD:website/unify-show-footers
