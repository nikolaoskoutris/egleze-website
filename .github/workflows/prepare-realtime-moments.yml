name: Prepare Real-Time Moments homepage

on:
  push:
    branches:
      - homepage/realtime-moments
    paths:
      - .github/workflows/prepare-realtime-moments.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: homepage/realtime-moments
          fetch-depth: 0

      - name: Finalize and validate homepage
        run: node scripts/finalize-realtime-moments.js

      - name: Commit finalized homepage
        run: |
          if git diff --quiet -- index.html; then
            echo "Homepage already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize Real-Time Moments homepage mechanics"
          git push origin HEAD:homepage/realtime-moments
