name: One-shot fix serverless Supabase publishable key

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fix-serverless-supabase-key.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: node scripts/fix-serverless-supabase-publishable-key.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/episode.js api/sitemap.js
          git commit -m "Use current Supabase publishable key in server functions"
          git push origin HEAD:main
